<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
    <defs>
      <linearGradient id="background" x1="0" y1="0" x2="1280" y2="800">
        <stop stop-color="#eee9ff"/>
        <stop offset=".42" stop-color="#f7f5fc"/>
        <stop offset="1" stop-color="#f5f3fb"/>
      </linearGradient>
      <linearGradient id="brandGradient" x1="0" y1="0" x2="48" y2="48">
        <stop stop-color="#7c5cff"/>
        <stop offset="1" stop-color="#3e2ba8"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2f2262" flood-opacity=".13"/>
      </filter>
    </defs>
    <rect width="1280" height="800" fill="url(#background)"/>
    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      
    <g transform="translate(100 35) scale(1)">
      <rect width="48" height="48" rx="13" fill="url(#brandGradient)"/>
      <path d="M31 33H17l-6-6.2a2 2 0 0 1 0-2.8l12-12a2 2 0 0 1 2.8 0l8.2 8.2a2 2 0 0 1 0 2.8L22 35" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 25L21 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M12 40h25" fill="none" stroke="#57e4c5" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="164" y="57" font-size="23" font-weight="760" fill="#201f2a" >History Keyword Cleaner</text>
    <text x="164" y="77" font-size="13" font-weight="400" fill="#676475" >Private, automatic history cleanup</text>
    <rect x="888" y="38" width="292" height="47" rx="12" fill="#edf9f6" stroke="#b8dfd7" />
    <text x="1162" y="57" font-size="12" font-weight="800" fill="#087f68" text-anchor="end">100% local</text>
    <text x="1162" y="73" font-size="11" font-weight="400" fill="#676475" text-anchor="end">No telemetry, accounts, or network requests</text><rect x="100" y="109" width="777" height="250" rx="18" fill="#fff" stroke="#ded9ea" filter="url(#shadow)"/>
    <text x="122" y="138" font-size="10" font-weight="800" fill="#6547d9" letter-spacing="1.4">RULES</text>
    <text x="122" y="166" font-size="18" font-weight="740" fill="#201f2a" >Keyword list</text>
    <rect x="785" y="134" width="68" height="26" rx="13" fill="#eee9ff" stroke="none" />
    <text x="819" y="152" font-size="11" font-weight="800" fill="#6547d9" text-anchor="middle">3 / 500</text>
    <text x="122" y="193" font-size="13" font-weight="400" fill="#676475" >Enter one literal keyword per line. Regular expressions are intentionally not used.</text>
    <text x="122" y="222" font-size="12" font-weight="700" fill="#201f2a" >Keywords</text>
    <rect x="122" y="233" width="731" height="78" rx="10" fill="#fbfaff" stroke="#ded9ea" />
    <text x="138" y="259" font-size="13" font-weight="400" fill="#201f2a" >example.com</text>
    <text x="138" y="282" font-size="13" font-weight="400" fill="#201f2a" >private project</text>
    <text x="138" y="305" font-size="13" font-weight="400" fill="#201f2a" >/sensitive/</text>
    <text x="122" y="340" font-size="12" font-weight="700" fill="#676475" >Match in:</text>
    <rect x="194" y="327" width="16" height="16" rx="4" fill="#6547d9" stroke="#6547d9" /><path d="M198 335l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="217" y="340" font-size="12" font-weight="400" fill="#201f2a" >URLs</text>
    <rect x="274" y="327" width="16" height="16" rx="4" fill="#6547d9" stroke="#6547d9" /><path d="M278 335l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="297" y="340" font-size="12" font-weight="400" fill="#201f2a" >Page titles</text>
    <rect x="389" y="327" width="16" height="16" rx="4" fill="#fff" stroke="#ded9ea" />
    <text x="412" y="340" font-size="12" font-weight="400" fill="#201f2a" >Case-sensitive</text>
    <rect x="100" y="379" width="777" height="310" rx="18" fill="#fff" stroke="#ded9ea" filter="url(#shadow)"/>
    <text x="122" y="408" font-size="10" font-weight="800" fill="#6547d9" letter-spacing="1.4">MAINTENANCE</text>
    <text x="122" y="436" font-size="18" font-weight="740" fill="#201f2a" >Existing history</text>
    <rect x="122" y="455" width="731" height="55" rx="12" fill="#fff5dc" stroke="none" />
    <text x="138" y="477" font-size="12" font-weight="750" fill="#201f2a" >Deletion cannot be undone</text>
    <text x="138" y="495" font-size="11" font-weight="400" fill="#676475" >Preview first if you are unsure about a rule.</text>
    <rect x="122" y="527" width="731" height="133" rx="12" fill="#fff" stroke="#ded9ea" />
       <path d="M122 539a12 12 0 0 1 12-12h707a12 12 0 0 1 12 12v32H122z" fill="#eee9ff"/>
       <text x="139" y="554" font-size="12" font-weight="750" fill="#6547d9" >11 matches in 1,240 history entries (showing up to 25).</text>
       <text x="139" y="594" font-size="12" font-weight="700" fill="#201f2a" >Example Domain</text>
       <text x="139" y="616" font-size="11" font-weight="400" fill="#676475" >https://example.com/private-project</text>
       <text x="825" y="616" font-size="10" font-weight="600" fill="#6547d9" text-anchor="end">matched “example.com”</text><rect x="897" y="109" width="283" height="430" rx="18" fill="#fff" stroke="#ded9ea" filter="url(#shadow)"/>
    <text x="919" y="139" font-size="10" font-weight="800" fill="#6547d9" letter-spacing="1.4">STATUS</text>
    <text x="919" y="165" font-size="18" font-weight="740" fill="#201f2a" >Cleaning activity</text>
    <rect x="919" y="194" width="229" height="92" rx="13" fill="#edf8f5" stroke="#b8dfd7" />
       <circle cx="939" cy="216" r="9" fill="#087f68"/>
       <text x="939" y="220" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">✓</text>
       <text x="955" y="220" font-size="12" font-weight="700" fill="#201f2a" >Operation complete</text>
       <text x="939" y="246" font-size="11" font-weight="400" fill="#676475" >1,240 checked · 11 matches</text>
       <text x="939" y="263" font-size="11" font-weight="700" fill="#087f68" >Preview only — nothing deleted</text>
    <text x="919" y="312" font-size="11" font-weight="400" fill="#676475" >Last run</text>
    <text x="1158" y="312" font-size="13" font-weight="700" fill="#201f2a" text-anchor="end">just now</text>
    <line x1="919" y1="325" x2="1158" y2="325" stroke="#ded9ea"/>
    <text x="919" y="359" font-size="11" font-weight="400" fill="#676475" >Last deleted</text>
    <text x="1158" y="359" font-size="13" font-weight="700" fill="#201f2a" text-anchor="end">4</text>
    <line x1="919" y1="372" x2="1158" y2="372" stroke="#ded9ea"/>
    <text x="919" y="406" font-size="11" font-weight="400" fill="#676475" >Total deleted</text>
    <text x="1158" y="406" font-size="13" font-weight="700" fill="#201f2a" text-anchor="end">137</text>
    <text x="1158" y="516" font-size="10" font-weight="400" fill="#676475" text-anchor="end">v0.1.1</text>
      
    </g>
  </svg>