name: CI, lint, and package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Firefox add-on
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Set monotonically increasing main binary version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/set-build-version.mjs --run-number "${GITHUB_RUN_NUMBER}"

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Run project safety checks
        run: pnpm check

      - name: Run Mozilla web-ext validation
        run: pnpm lint:webext

      - name: Run Mozilla addons-linter directly
        run: pnpm lint:addons

      - name: Build unsigned Firefox package
        run: pnpm build

      - name: Prepare release asset
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src/manifest.json', 'utf8')).version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          SOURCE_FILE="$(find artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)"
          ASSET_NAME="History-Keyword-Cleaner-v${VERSION}-${SHORT_SHA}.zip"
          test -n "${SOURCE_FILE}"
          mv "${SOURCE_FILE}" "artifacts/${ASSET_NAME}"
          echo "artifact_name=History-Keyword-Cleaner-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Validate the exact packaged ZIP with addons-linter
        run: pnpm exec addons-linter "artifacts/${{ steps.package.outputs.asset_name }}" --warnings-as-errors

      - name: Upload package from main
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: artifacts/${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          pattern: History-Keyword-Cleaner-*
          path: release-assets
          merge-multiple: true

      - name: Determine release metadata
        id: release
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "title=History Keyword Cleaner ${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "version_tag=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=main-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "title=History Keyword Cleaner main ${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "version_tag=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          IS_VERSION_TAG: ${{ steps.release.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_PATH="$(find release-assets -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "${ASSET_PATH}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSET_PATH}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --prerelease=false \
              --title "${RELEASE_TITLE}"
          elif [[ "${IS_VERSION_TAG}" == "false" ]]; then
            gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "${RELEASE_TITLE}"
          else
            gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TITLE}"
          fi
