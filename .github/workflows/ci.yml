name: CI, lint, and package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Firefox add-on
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Run project safety checks
        run: pnpm check

      - name: Run Mozilla web-ext validation
        run: pnpm lint:webext

      - name: Run Mozilla addons-linter directly
        run: pnpm lint:addons

      - name: Build unsigned Firefox package
        run: pnpm build

      - name: Prepare release asset
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src/manifest.json', 'utf8')).version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          SOURCE_FILE="$(find artifacts -maxdepth 1 -type f -name '*.zip' -print -quit)"
          ASSET_NAME="History-Keyword-Cleaner-v${VERSION}-${SHORT_SHA}.zip"
          test -n "${SOURCE_FILE}"
          mv "${SOURCE_FILE}" "artifacts/${ASSET_NAME}"
          echo "artifact_name=History-Keyword-Cleaner-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Validate the exact packaged ZIP with addons-linter
        run: pnpm exec addons-linter "artifacts/${{ steps.package.outputs.asset_name }}" --warnings-as-errors

      - name: Upload package from main
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: artifacts/${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          pattern: History-Keyword-Cleaner-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.zip
          --verify-tag
          --generate-notes
          --title "History Keyword Cleaner ${GITHUB_REF_NAME}"
